name: PR body

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check PR body format
    runs-on: ubuntu-latest
    # The repo owner's own PRs skip the format check; bots / Dependabot use their own body shapes;
    # humans and agents must follow the template.
    if: ${{ github.actor != 'wibus-wee' && !endsWith(github.actor, '[bot]') && github.actor != 'dependabot' }}
    steps:
      - uses: actions/checkout@v4

      - name: Test PR body checker
        run: node .github/scripts/check-pr-body.test.mjs

      - name: Validate PR body
        id: validate
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set +e
          node .github/scripts/check-pr-body.mjs > /tmp/pr-body-check.txt 2>&1
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/pr-body-check.txt

      - name: Notify author on format failure
        if: steps.validate.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const author = context.payload.pull_request.user.login
            const findings = fs.readFileSync('/tmp/pr-body-check.txt', 'utf8')
              .trim()
              .split('\n')
              .slice(0, 40)
              .join('\n')
            const marker = '<!-- cradle-pr-body-format-check -->'
            const body = [
              marker,
              `@${author} this pull request body does **not** match Cradle's PR template.`,
              '',
              'Please update the description to follow `.github/PULL_REQUEST_TEMPLATE.md`:',
              '',
              '- Check **Author type** (`I am an Agent` or `I am a human`)',
              '- Fill **Problem / pressure** (the constraint this PR responds to — review against pressure, not aesthetics)',
              '- Fill **Summary** and **Test plan**',
              '- If you are an Agent: keep the **Agent handoff** block (reviewing-agent instructions, authoring context, sharing consent)',
              '',
              '<details><summary>Checker findings</summary>',
              '',
              '```',
              findings || '(no details)',
              '```',
              '',
              '</details>',
            ].join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

      - name: Clear format failure comment on success
        if: steps.validate.outputs.code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- cradle-pr-body-format-check -->'
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              })
            }

      - name: Fail job when body is invalid
        if: steps.validate.outputs.code != '0'
        run: |
          echo "PR body format check failed"
          exit 1
