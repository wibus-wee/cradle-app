name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CI scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.push.outputs.code || steps.filter.outputs.code }}
      mobile: ${{ steps.push.outputs.mobile || steps.filter.outputs.mobile }}
      chronicle: ${{ steps.push.outputs.chronicle || steps.filter.outputs.chronicle }}
      build_web: ${{ steps.push.outputs.build_web || steps.filter.outputs.build_web }}
      build_server: ${{ steps.push.outputs.build_server || steps.filter.outputs.build_server }}
      build_desktop: ${{ steps.push.outputs.build_desktop || steps.filter.outputs.build_desktop }}
      build_targets: ${{ steps.matrix.outputs.build_targets }}
    steps:
      - name: Run the complete gate for pushes to main
        id: push
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo 'code=true' >> "$GITHUB_OUTPUT"
          echo 'mobile=true' >> "$GITHUB_OUTPUT"
          echo 'chronicle=true' >> "$GITHUB_OUTPUT"
          echo 'build_web=true' >> "$GITHUB_OUTPUT"
          echo 'build_server=true' >> "$GITHUB_OUTPUT"
          echo 'build_desktop=true' >> "$GITHUB_OUTPUT"

      # pull_request path filtering uses the GitHub API and does not need a
      # checkout. Documentation-only PRs can therefore avoid every expensive
      # validation job while still leaving this scope check green.
      - name: Detect changed areas for pull requests
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '**/*.cjs'
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.go'
              - '**/*.rs'
              - '**/*.html'
              - '**/*.mdx'
              - '**/*.proto'
              - '**/*.graphql'
              - '**/*.css'
              - '**/*.scss'
              - '**/*.sh'
              - '**/*.sql'
              - '**/*.toml'
              - '**/*.patch'
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.yml'
              - 'Dockerfile*'
              - 'Makefile'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/**'
            mobile:
              - 'apps/mobile/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/actions/setup/**'
              - '.github/workflows/ci.yml'
            chronicle:
              - 'chronicle/**'
              - '.github/workflows/ci.yml'
            build_web:
              - 'apps/web/**'
              - 'packages/**'
              - 'plugins/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/actions/setup/**'
              - '.github/workflows/ci.yml'
            build_server:
              - 'apps/server/**'
              - 'packages/**'
              - 'plugins/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/actions/setup/**'
              - '.github/workflows/ci.yml'
            build_desktop:
              - 'apps/desktop/**'
              - 'apps/server/**'
              - 'apps/relayd/**'
              - 'packages/**'
              - 'plugins/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/actions/setup/**'
              - '.github/workflows/ci.yml'

      - name: Resolve build matrix
        id: matrix
        shell: bash
        env:
          BUILD_WEB: ${{ steps.push.outputs.build_web || steps.filter.outputs.build_web }}
          BUILD_SERVER: ${{ steps.push.outputs.build_server || steps.filter.outputs.build_server }}
          BUILD_DESKTOP: ${{ steps.push.outputs.build_desktop || steps.filter.outputs.build_desktop }}
        run: |
          targets=()
          if [ "$BUILD_WEB" = 'true' ]; then targets+=(web); fi
          if [ "$BUILD_SERVER" = 'true' ]; then targets+=(server); fi
          if [ "$BUILD_DESKTOP" = 'true' ]; then targets+=(desktop); fi

          # Keep the matrix non-empty for an unusual code/config path that is
          # not covered by a target-specific filter. The complete build is
          # the safe fallback; ordinary web-only/server-only PRs stay narrow.
          if [ "${#targets[@]}" -eq 0 ]; then
            targets=(web server desktop)
          fi

          targets_json='['
          separator=''
          for target in "${targets[@]}"; do
            targets_json+="${separator}\"${target}\""
            separator=','
          done
          targets_json+=']'
          echo "build_targets=$targets_json" >> "$GITHUB_OUTPUT"

  shared-artifacts:
    name: Shared build artifacts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build shared SDK and plugins once
        run: pnpm --filter @cradle/plugin-sdk build && pnpm --filter "./plugins/*" build
      - uses: actions/upload-artifact@v4
        with:
          name: shared-build-${{ github.run_id }}
          path: |
            packages/plugin-sdk/dist/
            plugins/*/dist/
          retention-days: 1

  # ─── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run ESLint
        run: pnpm lint

  # ─── Typecheck ────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck (${{ matrix.target }})
    needs: [changes, shared-artifacts]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [node, server, web, desktop, simulator]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: shared-build-${{ github.run_id }}
          path: .
      - name: Typecheck selected target
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            node) pnpm exec tsc --noEmit -p tsconfig.node.json --composite false ;;
            server) pnpm --filter @cradle/server exec tsc --noEmit && node --import tsx apps/server/scripts/check-module-boundaries.ts ;;
            web) pnpm --filter @cradle/web exec tsc --noEmit ;;
            desktop) pnpm --filter @cradle/desktop exec tsc --noEmit -p tsconfig.node.json ;;
            simulator) pnpm --filter @cradle/model-api-simulator typecheck && pnpm --filter @cradle/model-api-simulator protocol:check && pnpm --filter @cradle/model-api-simulator coverage:check ;;
          esac

  # ─── Mobile (Expo / React Native merge gate) ───────────────────────────────
  mobile:
    name: Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Typecheck Mobile (apps/mobile)
        run: pnpm typecheck:mobile
      - name: Check Expo dependency versions
        run: pnpm --filter @cradle/mobile exec expo install --check
      - name: Export iOS production bundle
        run: pnpm --filter @cradle/mobile exec expo export --platform ios --output-dir ${{ runner.temp }}/cradle-mobile-ios
      - name: Export Android production bundle
        run: pnpm --filter @cradle/mobile exec expo export --platform android --output-dir ${{ runner.temp }}/cradle-mobile-android

  # ─── Unit Tests (src + packages) ──────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [changes, shared-artifacts]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: shared-build-${{ github.run_id }}
          path: .
      - name: Run Vitest (src, packages, web; server has one owner below)
        run: pnpm exec vitest run --project node --project apps/web
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.run_id }}
          path: coverage/
          retention-days: 7

  # ─── Server Tests (apps/server) ───────────────────────────────────────────
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    needs: [changes, shared-artifacts]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 35
    env:
      CRADLE_CREDENTIAL_SECRET: ci-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: shared-build-${{ github.run_id }}
          path: .
      - name: Run Server Vitest
        run: pnpm --filter @cradle/server exec vitest run
      - name: Upload server test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results-${{ github.run_id }}
          path: apps/server/coverage/
          retention-days: 7

  relayd-tests:
    name: Relayd Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/relayd/go.mod
          cache-dependency-path: apps/relayd/go.sum
      - name: Run relayd Go tests
        working-directory: apps/relayd
        run: go test ./...

  chronicle-macos:
    name: Chronicle macOS
    needs: changes
    if: needs.changes.outputs.chronicle == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chronicle
      - name: Test Chronicle with default native features
        run: cargo test --manifest-path chronicle/Cargo.toml --all-targets

  desktop-server-fetch-smoke:
    name: Desktop Server Fetch Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Electron runtime dependencies and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          pnpm exec playwright install-deps chromium
      - name: Run development Server fetch smoke
        env:
          CRADLE_SERVER_FETCH_SMOKE_NO_SANDBOX: '1'
        run: xvfb-run -a pnpm --filter @cradle/desktop smoke:server-fetch:development
      - name: Run packaged Server fetch smoke
        if: always()
        env:
          CRADLE_SERVER_FETCH_SMOKE_NO_SANDBOX: '1'
        run: xvfb-run -a pnpm --filter @cradle/desktop smoke:server-fetch:packaged
      - name: Upload Server fetch smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-server-fetch-smoke-${{ github.run_id }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: |
            apps/desktop/.server-fetch-smoke/**
            apps/desktop/release/server-fetch-smoke/builder-effective-config.yaml

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Builds and typechecks are independent consumers of the shared artifact.
    # Let them start together instead of waiting for the slowest typecheck.
    needs: [changes, shared-artifacts]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.build_targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: shared-build-${{ github.run_id }}
          path: .
      - name: Build selected target without rebuilding shared artifacts
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            web) pnpm --filter @cradle/web exec vite build ;;
            server) pnpm --filter @cradle/server exec vite build ;;
            desktop)
              pnpm --filter @cradle/server exec vite build
              pnpm --filter @cradle/server exec node scripts/prepare-desktop-runtime.mjs
              pnpm --filter @cradle/server exec node scripts/rebuild-electron-runtime.mjs
              pnpm --filter @cradle/server exec node scripts/prepare-desktop-plugins.mjs
              pnpm --filter @cradle/cli build
              pnpm --filter @cradle/desktop build:mac-bridge
              pnpm --filter @cradle/desktop rebuild:sparkle
              pnpm --filter @cradle/desktop exec electron-vite build
              ;;
          esac
