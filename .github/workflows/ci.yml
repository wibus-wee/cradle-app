name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run ESLint
        run: pnpm lint

  # ─── Typecheck ────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Typecheck Server (apps/server)
        run: pnpm typecheck:server
      - name: Typecheck Web App (apps/web)
        run: pnpm typecheck:apps-web
      - name: Typecheck Desktop (apps/desktop)
        run: pnpm typecheck:desktop
      - name: Typecheck Model API Simulator
        run: pnpm typecheck:model-api-simulator
      - name: Check Model API Simulator Protocol Artifacts
        run: pnpm --filter @cradle/model-api-simulator protocol:check
      - name: Check Model API Simulator Protocol Coverage
        run: pnpm --filter @cradle/model-api-simulator coverage:check

  # ─── Mobile (Expo / React Native merge gate) ───────────────────────────────
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Typecheck Mobile (apps/mobile)
        run: pnpm typecheck:mobile
      - name: Check Expo dependency versions
        run: pnpm --filter @cradle/mobile exec expo install --check
      - name: Export iOS production bundle
        run: pnpm --filter @cradle/mobile exec expo export --platform ios --output-dir ${{ runner.temp }}/cradle-mobile-ios
      - name: Export Android production bundle
        run: pnpm --filter @cradle/mobile exec expo export --platform android --output-dir ${{ runner.temp }}/cradle-mobile-android

  # ─── Unit Tests (src + packages) ──────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run Vitest (src + packages)
        run: pnpm test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.run_id }}
          path: coverage/
          retention-days: 7

  # ─── Server Tests (apps/server) ───────────────────────────────────────────
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    env:
      CRADLE_CREDENTIAL_SECRET: ci-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run Server Vitest
        run: pnpm test:server
      - name: Upload server test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results-${{ github.run_id }}
          path: apps/server/coverage/
          retention-days: 7

  chronicle-macos:
    name: Chronicle macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chronicle
      - name: Test Chronicle with default native features
        run: cargo test --manifest-path chronicle/Cargo.toml --all-targets

  desktop-server-fetch-smoke:
    name: Desktop Server Fetch Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Electron runtime dependencies and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          pnpm exec playwright install-deps chromium
      - name: Run development Server fetch smoke
        env:
          CRADLE_SERVER_FETCH_SMOKE_NO_SANDBOX: '1'
        run: xvfb-run -a pnpm --filter @cradle/desktop smoke:server-fetch:development
      - name: Run packaged Server fetch smoke
        if: always()
        env:
          CRADLE_SERVER_FETCH_SMOKE_NO_SANDBOX: '1'
        run: xvfb-run -a pnpm --filter @cradle/desktop smoke:server-fetch:packaged
      - name: Upload Server fetch smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-server-fetch-smoke-${{ github.run_id }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: |
            apps/desktop/.server-fetch-smoke/**
            apps/desktop/release/server-fetch-smoke/builder-effective-config.yaml

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build Web App (apps/web)
        run: pnpm build:web
      - name: Build Server (apps/server)
        run: pnpm build:server
      - name: Build Desktop (apps/desktop)
        run: pnpm build:desktop
