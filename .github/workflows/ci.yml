name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CI scope
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      mobile: ${{ steps.filter.outputs.mobile }}
      chronicle: ${{ steps.filter.outputs.chronicle }}
      relayd: ${{ steps.filter.outputs.relayd }}
      unit: ${{ steps.filter.outputs.unit }}
      server_tests: ${{ steps.filter.outputs.server_tests }}
      shared: ${{ steps.matrix.outputs.shared }}
      build_targets: ${{ steps.matrix.outputs.build_targets }}
      typecheck_targets: ${{ steps.matrix.outputs.typecheck_targets }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # PRs use the complete PR diff; pushes compare with the previous main.
          base: ${{ github.event.before || github.event.repository.default_branch }}
          filters: .github/ci-paths.yml

      - name: Resolve validation matrices
        id: matrix
        shell: bash
        env:
          BUILD_WEB: ${{ steps.filter.outputs.build_web }}
          BUILD_SERVER: ${{ steps.filter.outputs.build_server }}
          BUILD_DESKTOP: ${{ steps.filter.outputs.build_desktop }}
          WEB: ${{ steps.filter.outputs.web }}
          SERVER: ${{ steps.filter.outputs.server }}
          DESKTOP: ${{ steps.filter.outputs.desktop }}
          SIMULATOR: ${{ steps.filter.outputs.simulator }}
          UNIT: ${{ steps.filter.outputs.unit }}
          SERVER_TESTS: ${{ steps.filter.outputs.server_tests }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          const enabled = key => process.env[key] === 'true'
          const builds = ['web', 'server', 'desktop'].filter(target => enabled('BUILD_' + target.toUpperCase()))
          const typechecks = [
            ...(enabled('SERVER') ? ['node', 'server'] : []),
            ...(enabled('WEB') ? ['web'] : []),
            ...(enabled('DESKTOP') ? ['desktop'] : []),
            ...(enabled('SIMULATOR') ? ['simulator'] : []),
          ]
          const shared = builds.length > 0 || typechecks.length > 0 || enabled('UNIT') || enabled('SERVER_TESTS')
          appendFileSync(process.env.GITHUB_OUTPUT, [
            'build_targets=' + JSON.stringify(builds),
            'typecheck_targets=' + JSON.stringify(typechecks),
            'shared=' + shared,
            '',
          ].join('\n'))
          NODE

  shared-artifacts:
    name: Shared build artifacts
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build shared SDK and plugins once
        run: pnpm --filter @cradle/plugin-sdk build && pnpm --filter "./plugins/*" build
      - uses: actions/upload-artifact@v4
        with:
          name: shared-build-${{ github.run_id }}
          path: |
            packages/plugin-sdk/dist/
            plugins/*/dist/
          retention-days: 1

  # ─── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run ESLint
        run: pnpm lint
      - name: Check CI scope rules
        run: node --test .github/scripts/ci-paths.test.mjs

  # ─── Typecheck ────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck (${{ matrix.target }})
    needs: [changes, shared-artifacts]
    if: needs.changes.outputs.typecheck_targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.typecheck_targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: shared-build-${{ github.run_id }}
          path: .
      - name: Typecheck selected target
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            node) pnpm exec tsc --noEmit -p tsconfig.node.json --composite false ;;
            server) pnpm --filter @cradle/server exec tsc --noEmit && node --import tsx apps/server/scripts/check-module-boundaries.ts ;;
            web) pnpm --filter @cradle/web exec tsc --noEmit ;;
            desktop) pnpm --filter @cradle/desktop exec tsc --noEmit -p tsconfig.node.json ;;
            simulator) pnpm --filter @cradle/model-api-simulator typecheck && pnpm --filter @cradle/model-api-simulator protocol:check && pnpm --filter @cradle/model-api-simulator coverage:check ;;
          esac

  # ─── Mobile (Expo / React Native merge gate) ───────────────────────────────
  mobile:
    name: Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Typecheck Mobile (apps/mobile)
        run: pnpm typecheck:mobile
      - name: Check Expo dependency versions
        run: pnpm --filter @cradle/mobile exec expo install --check
      - name: Export iOS production bundle
        run: pnpm --filter @cradle/mobile exec expo export --platform ios --output-dir ${{ runner.temp }}/cradle-mobile-ios
      - name: Export Android production bundle
        run: pnpm --filter @cradle/mobile exec expo export --platform android --output-dir ${{ runner.temp }}/cradle-mobile-android

  # ─── Unit Tests (src + packages) ──────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [changes, shared-artifacts]
    if: needs.changes.outputs.unit == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: shared-build-${{ github.run_id }}
          path: .
      - name: Run Vitest (src, packages, web; server has one owner below)
        run: pnpm exec vitest run --project node --project apps/web
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.run_id }}
          path: coverage/
          retention-days: 7

  # ─── Server Tests (apps/server) ───────────────────────────────────────────
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    needs: [changes, shared-artifacts]
    if: needs.changes.outputs.server_tests == 'true'
    timeout-minutes: 35
    env:
      CRADLE_CREDENTIAL_SECRET: ci-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: shared-build-${{ github.run_id }}
          path: .
      - name: Run Server Vitest
        run: pnpm --filter @cradle/server exec vitest run
      - name: Upload server test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results-${{ github.run_id }}
          path: apps/server/coverage/
          retention-days: 7

  relayd-tests:
    name: Relayd Tests
    needs: changes
    if: needs.changes.outputs.relayd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/relayd/go.mod
          cache-dependency-path: apps/relayd/go.sum
      - name: Run relayd Go tests
        working-directory: apps/relayd
        run: go test ./...

  chronicle-macos:
    name: Chronicle macOS
    needs: changes
    if: needs.changes.outputs.chronicle == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chronicle
      - name: Test Chronicle with default native features
        run: cargo test --manifest-path chronicle/Cargo.toml --all-targets

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Builds and typechecks are independent consumers of the shared artifact.
    # Let them start together instead of waiting for the slowest typecheck.
    needs: [changes, shared-artifacts]
    if: needs.changes.outputs.build_targets != '[]'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.build_targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: shared-build-${{ github.run_id }}
          path: .
      - name: Build selected target without rebuilding shared artifacts
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            web) pnpm --filter @cradle/web exec vite build ;;
            server) pnpm --filter @cradle/server exec vite build ;;
            desktop)
              pnpm --filter @cradle/server exec vite build
              pnpm --filter @cradle/server exec node scripts/prepare-desktop-runtime.mjs
              pnpm --filter @cradle/server exec node scripts/rebuild-electron-runtime.mjs
              pnpm --filter @cradle/server exec node scripts/prepare-desktop-plugins.mjs
              pnpm --filter @cradle/cli build
              pnpm --filter @cradle/desktop build:mac-bridge
              pnpm --filter @cradle/desktop rebuild:sparkle
              pnpm --filter @cradle/desktop exec electron-vite build
              ;;
          esac
