appId: app.cradle.mobile
---
- launchApp
- extendedWaitUntil:
    visible:
      id: fabric-node-picker
    timeout: 45000
- assertVisible:
    id: fabric-node-${NODE_ID}
- tapOn:
    id: fabric-node-${NODE_ID}
- extendedWaitUntil:
    visible: ${WORKSPACE_NAME}.*
    timeout: 45000
- assertNotVisible: ${OTHER_WORKSPACE_NAME}.*
