appId: app.cradle.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: fabric-code-input
    timeout: 30000
- tapOn:
    id: fabric-code-input
- setClipboard: ${FABRIC_CODE}
- pasteText
- tapOn: Join your Fabric
- tapOn:
    id: fabric-request-access
- extendedWaitUntil:
    visible:
      id: fabric-enrollment-pending
    timeout: 30000
- assertVisible: Waiting for approval
