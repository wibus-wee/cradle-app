appId: app.cradle.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: fabric-code-input
    timeout: 30000
- tapOn:
    id: fabric-code-input
    retryTapIfNoChange: true
- waitForAnimationToEnd
- inputText: ${FABRIC_CODE}
- hideKeyboard
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: fabric-request-access
      enabled: true
    timeout: 15000
- tapOn:
    id: fabric-request-access
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: fabric-enrollment-pending
    timeout: 30000
- assertVisible: Waiting for approval
