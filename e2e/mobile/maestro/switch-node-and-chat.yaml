appId: app.cradle.mobile
---
- launchApp
- extendedWaitUntil:
    visible: Workspaces
    timeout: 30000
- tapOn: Open navigation
- tapOn: Settings
- extendedWaitUntil:
    visible: Settings
    timeout: 15000
- tapOn:
    id: settings-node-${NODE_ID}
- tapOn: Open navigation
- tapOn: Workspaces
- extendedWaitUntil:
    visible: ${WORKSPACE_NAME}.*
    timeout: 45000
- assertNotVisible: ${OTHER_WORKSPACE_NAME}.*
- tapOn: ${WORKSPACE_NAME}.*
- extendedWaitUntil:
    visible: ${SESSION_TITLE}.*
    timeout: 45000
- tapOn: ${SESSION_TITLE}.*
- extendedWaitUntil:
    visible:
      id: chat-message-input
    timeout: 45000
- tapOn:
    id: chat-message-input
- inputText: ${CHAT_PROMPT}
- tapOn:
    id: chat-send-message
- extendedWaitUntil:
    visible: ${CHAT_RESPONSE}
    timeout: 60000
