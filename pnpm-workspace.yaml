packages:
  - packages/*
  - apps/*
  - plugins/*
enableGlobalVirtualStore: true
# Broken upstream packages omit these deps; GVS + Vite/esbuild resolve from the
# store realpath, so undeclared imports fail unless they are linked as siblings.
packageExtensions:
  echarts-for-react:
    dependencies:
      tslib: ^2.3.0
  tiptap-markdown:
    peerDependencies:
      '@tiptap/pm': '*'
  # electron-vite resolves Electron from its own realpath. Link the app's
  # Electron runtime into the virtual package so this works with GVS enabled.
  electron-vite:
    dependencies:
      electron: 44.0.0
allowBuilds:
  '@google/genai': true
  '@swc/core': true
  better-sqlite3: true
  core-js: false
  electron: true
  electron-sparkle-updater: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  msw: true
  node-pty: true
  protobufjs: true
  sharp: true
  simple-git-hooks: false
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - '@hijarvis/core@0.1.0'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.205'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.205'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.205'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.205'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.205'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.205'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.205'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.205'
  - '@anthropic-ai/claude-agent-sdk@0.3.205'
  - '@arcships/light-ocr-darwin-arm64@0.1.0'
  - '@arcships/light-ocr-darwin-x64@0.1.0'
  - '@arcships/light-ocr-linux-x64-gnu@0.1.0'
  - '@arcships/light-ocr-model-ppocrv6-small@0.1.0'
  - '@arcships/light-ocr-win32-x64@0.1.0'
  - '@arcships/light-ocr@0.1.0'
  - '@arcships/light-ocr-darwin-arm64@0.3.0'
  - '@arcships/light-ocr-darwin-x64@0.3.0'
  - '@arcships/light-ocr-linux-x64-gnu@0.3.0'
  - '@arcships/light-ocr-model-ppocrv6-small@0.3.0'
  - '@arcships/light-ocr-win32-x64@0.3.0'
  - '@arcships/light-ocr@0.3.0'
overrides:
  '@cradle/cli': link:packages/cli
  # @electron/rebuild 4.2 resolves an older release that predates Electron 44.
  node-abi: 4.35.0
  # Mobile pins React 19.2.3 for Expo; keep web/desktop on the same exact pair.
  react: 19.2.3
  react-dom: 19.2.3
patchedDependencies:
  '@elysiajs/node@1.4.5': patches/@elysiajs__node@1.4.5.patch
